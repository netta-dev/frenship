[project]
name = "doc-check"
version = "0.1.0"
description = "Check a markdown doc's mechanics: list numbering, footnotes, relative links, and Mermaid blocks."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
doc-check = "doc_check.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_check"]
