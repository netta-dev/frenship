[project]
name = "comment-lint"
version = "0.1.0"
description = "Flag code comments that break the comment and prose conventions."
requires-python = ">=3.12"
dependencies = ["typesafe-sdk>=0.6.0"]

[project.scripts]
comment-lint = "comment_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comment_lint"]
